name: Petalfort destek talebi
description: Türkçe olarak hata, erişilebilirlik sorunu veya yanlış ürün bilgisi bildirin.
title: "[Destek] "
labels:
  - support
body:
  - type: markdown
    attributes:
      value: |
        Petalfort'u iyileştirmeye yardımcı olduğunuz için teşekkürler. Bu bildirim herkese açık olacaktır.

        Adınızı, e-posta adresinizi, cihaz seri numaranızı, oyun testi raporunu, kişisel bilgi içeren ekran görüntülerini veya başka hassas ya da gizli bilgileri eklemeyin.
  - type: checkboxes
    id: privacy
    attributes:
      label: Herkese açık bildirim onayı
      options:
        - label: Bu bildirimin herkese açık olduğunu anlıyorum; kişisel, hassas ve gizli bilgileri kaldırdım.
          required: true
  - type: dropdown
    id: category
    attributes:
      label: Kategori
      options:
        - Oynanış veya ilerleme
        - Arayüz veya yerelleştirme
        - Erişilebilirlik
        - Ses veya titreşim
        - Gizlilik veya destek bilgisi
        - Diğer teknik sorun
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Petalfort sürümü
      description: Bu bilgiyi Petalfort Ayarlar'da bulabilirsiniz. Cihaz seri numarası girmeyin.
      placeholder: "1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: iPhone modeli ve iOS sürümü
      placeholder: "iPhone 16, iOS 26.0"
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Etkilenen görev veya ekran
      placeholder: "Görev veya ekran adı"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Tekrarlama adımları
      description: Kısa ve numaralı bir liste kullanın.
      placeholder: |
        1. ... ekranını aç
        2. ... düğmesine dokun
        3. ... davranışını gözlemle
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Beklenen ve gerçekleşen sonuç
      placeholder: "Beklenen: ... Gerçekleşen: ..."
    validations:
      required: true
